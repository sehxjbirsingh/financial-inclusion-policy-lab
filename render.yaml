services:
  - type: web
    name: financial-inclusion-policy-lab
    env: python
    buildCommand: pip install -r requirements.txt && python analysis/run_analysis.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
